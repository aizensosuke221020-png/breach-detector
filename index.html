<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberShield - Data Breach Checker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .container { width: 100%; max-width: 600px; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--accent); text-align: center; }
    p.subtitle { font-size: 0.95rem; color: var(--text-muted); text-align: center; margin-bottom: 24px; }
    
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input[type="email"] { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; outline: none; }
    input[type="email"]:focus { border-color: var(--accent); }
    
    button { padding: 12px 24px; background: var(--accent); border: none; border-radius: 8px; color: #0f172a; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }

    .status { display: none; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; font-weight: bold; }
    .status.safe { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
    .status.pwned { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }

    .results-list { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
    .breach-card { background: #0f172a; padding: 16px; border-radius: 8px; border-left: 4px solid var(--danger); }
    .breach-card h3 { font-size: 1.1rem; color: white; }
    .breach-card p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
    .loader { display: none; text-align: center; margin: 15px 0; color: var(--accent); }
  </style>
</head>
<body>

<div class="container">
  <h1>🛡️ CyberShield Breach Checker</h1>
  <p class="subtitle">Check if your email or passwords have been exposed in a data breach</p>
  
  <div class="input-group">
    <input type="email" id="emailInput" placeholder="Enter email address..." required>
    <button onclick="checkBreach()">Scan Email</button>
  </div>

  <div id="loader" class="loader">Scanning dark web databases...</div>
  <div id="statusBox" class="status"></div>
  <div id="results" class="results-list"></div>
</div>

<script>
async function checkBreach() {
  const email = document.getElementById('emailInput').value.trim();
  const statusBox = document.getElementById('statusBox');
  const resultsDiv = document.getElementById('results');
  const loader = document.getElementById('loader');

  if (!email) {
    alert("Please enter a valid email address.");
    return;
  }

  // Reset UI
  statusBox.style.display = 'none';
  resultsDiv.innerHTML = '';
  loader.style.display = 'block';

  try {
    // API Call to XposedOrNot
    const response = await fetch(`https://api.xposedornot.com/v1/check-email/${encodeURIComponent(email)}`);
    const data = await response.json();

    loader.style.display = 'none';

    if (data.Error === "Not found" || !data.breaches) {
      statusBox.className = "status safe";
      statusBox.innerText = "✅ Good news! No known data breaches found for this email.";
      statusBox.style.display = "block";
    } else {
      const breaches = data.breaches[0]; // Returns array of breach names
      statusBox.className = "status pwned";
      statusBox.innerText = `⚠️ Warning: This email was found in ${breaches.length} data breach(es)!`;
      statusBox.style.display = "block";

      breaches.forEach(breachName => {
        const card = document.createElement('div');
        card.className = 'breach-card';
        card.innerHTML = `
          <h3>${breachName}</h3>
          <p>Compromised credentials detected in historical database dumps. Change your password immediately if reused across accounts.</p>
        `;
        resultsDiv.appendChild(card);
      });
    }
  } catch (error) {
    loader.style.display = 'none';
    statusBox.className = "status pwned";
    statusBox.innerText = "❌ Error connecting to breach database. Try again later.";
    statusBox.style.display = "block";
  }
}
</script>

</body>
</html>
